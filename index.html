<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ハイネちゃんと一緒に30分運動タイマー</title>
<style>
*{box-sizing:border-box}
:root{
  --theme:#c9b7ff;
  --theme-light:#eee9ff;
  --theme-soft:#f8f6ff;
  --theme-accent:#9b83e6;
  --side-bg:#eee9ff;
  --text:#3f4260;
  --muted:#8588a0;
}
body{
  margin:0;
  min-height:100vh;
  font-family:"Segoe UI","Yu Gothic",sans-serif;
  color:var(--text);
  text-align:center;
  background:linear-gradient(135deg,var(--side-bg),#fff 45%,var(--theme-soft));
  transition:background .35s ease;
}
.app-shell{
  max-width:1120px;
  min-height:100vh;
  margin:auto;
  background:#fff;
  padding:28px 34px 40px;
  box-shadow:0 0 45px rgba(80,70,120,.10);
}
header{margin-bottom:20px}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:42px;letter-spacing:.04em;color:var(--theme-accent);transition:color .35s}
.theme-label{font-size:12px;color:var(--muted);margin-right:3px}
.theme-picker{display:flex;align-items:center;gap:6px}
.theme-btn{
  width:22px;height:22px;min-width:22px;border-radius:50%;border:2px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.14);cursor:pointer;padding:0;margin:0
}
.theme-btn.active{outline:1.5px solid var(--theme-accent);outline-offset:2px}
.layout{
  display:grid;
  grid-template-columns:230px minmax(0,1fr);
  gap:26px;
  align-items:stretch;
}
.character-panel{
  min-height:660px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:30px;
  background:linear-gradient(145deg,var(--side-bg),var(--theme-light));
  overflow:visible;
}
.character-canvas{
  width:210px;
  height:210px;
  image-rendering:auto;
}
.speech-bubble{
  position:absolute;
  top:calc(50% - 190px);
  left:50%;
  transform:translateX(-50%) scale(.94);
  max-width:260px;
  min-width:190px;
  padding:11px 18px;
  border-radius:18px;
  background:#fff;
  border:2px solid var(--theme-light);
  box-shadow:0 7px 20px rgba(70,60,100,.13);
  font-size:15px;
  font-weight:bold;
  line-height:1.4;
  color:var(--text);
  opacity:0;
  visibility:hidden;
  transition:opacity .18s ease,transform .18s ease;
  z-index:3;
}
.speech-bubble::after{
  content:"";
  position:absolute;
  bottom:-10px;
  left:50%;
  width:18px;
  height:18px;
  background:#fff;
  border-right:2px solid var(--theme-light);
  border-bottom:2px solid var(--theme-light);
  transform:translateX(-50%) rotate(45deg);
}
.speech-bubble.show{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) scale(1);
}
.timer{
  font-size:92px;
  font-weight:bold;
  font-variant-numeric:tabular-nums;
  margin:3px 0 18px;
  color:#343850
}
.main-card{
  background:#fff;
  border:2px solid var(--theme-light);
  border-radius:30px;
  padding:25px 30px 28px;
  box-shadow:0 10px 30px rgba(80,70,120,.08);
}
.phase{font-size:20px;font-weight:bold;color:var(--theme-accent);min-height:30px}
.exercise{font-size:38px;font-weight:bold;margin:8px 0;color:var(--text)}
.side{font-size:30px;font-weight:bold;min-height:46px}
.side.right{color:#e66b72}
.side.left{color:#42ad83}
.timer{font-size:92px;font-weight:bold;font-variant-numeric:tabular-nums;margin:0 0 8px;color:#343850}
.description{
  background:var(--theme-soft);
  border-radius:18px;padding:16px 20px;margin:14px 0;
  box-shadow:0 3px 10px rgba(0,0,0,.05)
}
.description-title{font-size:14px;color:var(--muted);margin-bottom:5px}
.description-text{font-size:17px;line-height:1.6}
.next{
  background:#fafaff;border:1px solid var(--theme-light);
  border-radius:18px;padding:13px;margin:14px 0
}
.next-title{font-size:13px;color:var(--muted)}
.next-exercise{font-size:22px;font-weight:bold}
.progress-text{margin-top:20px;color:var(--muted)}
.seek-area{margin:10px 0 18px}
input[type=range]{width:100%;cursor:pointer;accent-color:var(--theme-accent)}
.seek-time{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:7px}
button{
  border:none;border-radius:14px;padding:13px 23px;margin:2px;
  font-size:17px;cursor:pointer;background:var(--theme-accent);color:#fff;
  transition:transform .12s,opacity .2s
}
button:hover{opacity:.84}button:active{transform:scale(.98)}
.reset{background:#a8aabd}
.volume{margin-top:16px;color:var(--muted)}
.volume input{width:180px}

@media(max-width:800px){
  body{min-width:0}
  .app-shell{padding:14px 10px 24px;box-shadow:none}
  header{margin-bottom:12px;min-height:44px}
  h1{font-size:29px}
  .theme-picker{right:0;gap:5px}
  .theme-btn{width:18px;height:18px;min-width:18px}
  .layout{grid-template-columns:1fr;gap:10px}
  .character-panel{min-height:190px;height:190px;border-radius:24px;order:0}
  .character-canvas{width:155px;height:155px}
  .speech-bubble{
    top:calc(50% - 155px);
    max-width:235px;
    min-width:175px;
    font-size:13px;
    padding:9px 15px;
  }
  .main-card{order:1;padding:17px 12px 20px;border-radius:24px}
  .phase{font-size:18px}.exercise{font-size:29px;margin:4px 0}
  .side{font-size:26px;min-height:38px}
  .timer{font-size:66px;margin:0 0 12px}
  .description{padding:13px 14px;margin:11px 0}
  .description-text{font-size:15px}
  .next{padding:10px;margin:11px 0}
  .next-exercise{font-size:19px}
  .progress-text{margin-top:14px}
  .controls button{padding:12px 18px;font-size:16px}
  .volume{margin-top:12px}
}
</style>
</head>

<header>
  <div class="title-row">
    <h1>30分トレーニングタイマー</h1>
    <div class="theme-label">テーマカラー</div>
    <div class="theme-picker">

  </div>
</header>

<div class="layout">

  <div class="main-card">

    <div id="side" class="side"></div>
    <div id="timer" class="timer">00:30</div>
    <div class="description">
      <div class="description-title">💡 やり方</div>
      <div id="descriptionText" class="description-text">スタートするとここに説明が表示されます。</div>
    </div>

    <div class="next">
      <div class="next-title">次の種目</div>
      <div id="nextExercise" class="next-exercise">---</div>
    </div>

    <div id="progressText" class="progress-text">0:00 / 30:00</div>
    <div class="seek-area">
      <input type="range" id="seekBar" min="0" max="1800" value="0" step="1">
      <div class="seek-time"><span>0:00</span><span>30:00</span></div>
    </div>

    <div class="controls">
      <button onclick="startTimer()">▶ スタート</button>
      <button onclick="pauseTimer()">⏸ 一時停止</button>
      <button class="reset" onclick="resetTimer()">↻ リセット</button>
    </div>

    <div class="volume">音量

    </div>
  </div>
</div>
</div>

const WORKOUT_TIME=1440;
const TOTAL_TIME=1800;

function formatTime(seconds){
    seconds=Math.max(0,Math.floor(seconds));
    const min=Math.floor(seconds/60);
    const sec=seconds%60;
    return String(min).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function beep(frequency=700,duration=0.12){
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    if(!AudioContext)return;
    const ctx=new AudioContext();
    const oscillator=ctx.createOscillator();
    const gain=ctx.createGain();
    oscillator.frequency.value=frequency;
    oscillator.type="sine";
    gain.gain.value=Number(volumeElement.value);
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);
    oscillator.stop(ctx.currentTime+duration);
}

function getCurrentState(){
    if(elapsed<WARMUP_TIME){
        const index=Math.floor(elapsed/30);
        return {phase:"warmup",index,remaining:30-(elapsed%30)};
    }
    if(elapsed<WARMUP_TIME+WORKOUT_TIME){
        const local=elapsed-WARMUP_TIME;
        const index=Math.floor(local/30);
        const within=local%30;
        return {phase:"workout",index,remaining:30-within,within};
    }
    if(elapsed<TOTAL_TIME){
        const local=elapsed-WARMUP_TIME-WORKOUT_TIME;
        const index=Math.floor(local/30);
        return {phase:"cooldown",index,remaining:30-(local%30)};
    }
    return {phase:"finished",index:0,remaining:0};

const characterGif=document.getElementById("characterGif");
let gifFrameIndex=0;
let gifFrameTimer=null;
characterGif.src=GIF_FRAMES[0];

function drawGifFrame(index){
    gifFrameIndex=index % GIF_FRAMES.length;
    characterGif.src=GIF_FRAMES[gifFrameIndex];
}

function startGif(){
    if(gifFrameTimer || GIF_FRAMES.length<2) return;
    gifFrameTimer=setInterval(()=>{
        if(running) drawGifFrame(gifFrameIndex+1);
    },200);
}

function pauseGif(){
    if(gifFrameTimer){
        clearInterval(gifFrameTimer);
        gifFrameTimer=null;
    }
}
const themes={
    lavender:{theme:"#c9b7ff",light:"#eee9ff",soft:"#f8f6ff",accent:"#9b83e6",side:"#eee9ff"},
    pink:{theme:"#f5b7cf",light:"#fde5ef",soft:"#fff7fa",accent:"#dc8ead",side:"#fde5ef"},
    blue:{theme:"#a9d8f2",light:"#e5f5fc",soft:"#f7fcff",accent:"#69add0",side:"#e5f5fc"},
    mint:{theme:"#a9dfcf",light:"#e3f6f0",soft:"#f7fffc",accent:"#61b69d",side:"#e3f6f0"},
    yellow:{theme:"#f6df9d",light:"#fff5d6",soft:"#fffdf5",accent:"#d2aa45",side:"#fff5d6"}
};

document.querySelectorAll(".theme-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
        const t=themes[btn.dataset.theme];
        document.documentElement.style.setProperty("--theme",t.theme);
        document.documentElement.style.setProperty("--theme-light",t.light);
        document.documentElement.style.setProperty("--theme-soft",t.soft);
        document.documentElement.style.setProperty("--theme-accent",t.accent);
        document.documentElement.style.setProperty("--side-bg",t.side);
        document.querySelectorAll(".theme-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
    });
});

    warmup:["一緒にがんばろう","見てるよ～","健康になりたいか！？","ゆっくりいこう","自分のペースで"],
    workout:["がんばろ～","おなかすいた","いい動きだ","まだまだ～","終わったらケーキ…","おみずのんで","おお～","やるね","今日何たべた？"],
    cooldown:["おつかれ～","よく頑張ったね～"]
};

function getSpeechForState(state){
    if(state.phase==="warmup"){
        return speechLines.warmup[state.index % speechLines.warmup.length];
    }
    if(state.phase==="workout"){
        return speechLines.workout[state.index % speechLines.workout.length];
    }
    if(state.phase==="cooldown"){
        return speechLines.cooldown[state.index % speechLines.cooldown.length];
    }
    return "またあした";
}

let speechTypingTimer=null;
let speechToken=0;

function showSpeech(text){
    speechToken++;
    const token=speechToken;
    if(speechTypingTimer) clearInterval(speechTypingTimer);
    speechBubble.textContent="";
    speechBubble.classList.remove("show");
    void speechBubble.offsetWidth;
    speechBubble.classList.add("show");
    let i=0;
    const chars=Array.from(text);
    speechTypingTimer=setInterval(()=>{
        if(token!==speechToken){
            clearInterval(speechTypingTimer);
            speechTypingTimer=null;
            return;
        }
        speechBubble.textContent+=chars[i++];
        if(i>=chars.length){
            clearInterval(speechTypingTimer);
            speechTypingTimer=null;
        }
    },100);
}

function hideSpeech(){
    speechToken++;
    if(speechTypingTimer) clearInterval(speechTypingTimer);
    speechTypingTimer=null;
    speechBubble.classList.remove("show");
}


const clickSpeechLines=["なに～？","……","ﾊｲﾈｦﾂﾂｶﾇﾝﾃﾞ…","むむむ","筋肉モリモリメメントモリ","コラーッ！","なんかくれるの？","ﾝﾌﾌ…","トレーニングおわった？","おみずのんでね","ほに","お前を見ている","パワー！","ヤーッ！","ほどほどにね","たまにはサボるべし","体調どう？","一緒に5555歳まで生きよう","また一緒にトレーニングしようね～","うに","ｳｯ","ウオオ"];
const clickGifSource=characterGif.src;
let clickGifTimeouts=[];
function clearClickGif(){
  clickGifTimeouts.forEach(clearTimeout);
  clickGifTimeouts=[];
}
function playClickGifTwice(){
  clearClickGif();
  const src=clickGifSource;
  if(!src)return;
  // Restart twice, then leave the GIF in its normal idle state.
  characterGif.src="";
  void characterGif.offsetWidth;
  characterGif.src=src;
  clickGifTimeouts.push(setTimeout(()=>{
    characterGif.src="";
    void characterGif.offsetWidth;
    characterGif.src=src;
  },1200));
  clickGifTimeouts.push(setTimeout(()=>{
    characterGif.src="";
    void characterGif.offsetWidth;
    characterGif.src=src;
  },2400));
}
document.querySelector(".character-panel").addEventListener("click",()=>{
  showSpeech(clickSpeechLines[Math.floor(Math.random()*clickSpeechLines.length)]);
  playClickGifTwice();
});

function updateDisplay(){
    seekBar.value=Math.floor(elapsed);
    progressText.textContent=`${formatTime(elapsed)} / 30:00`;
    const state=getCurrentState();

    sideElement.className="side";

    if(state.phase==="warmup"){
        const item=warmup[state.index];
        phaseElement.textContent="ウォームアップ";
        exerciseElement.textContent=item.name;
        sideElement.textContent="";
        timerElement.textContent=formatTime(state.remaining);
        descriptionElement.textContent=item.description;
        nextElement.textContent=state.index<warmup.length-1?warmup[state.index+1].name:workout[0].name;
        return;
    }

    if(state.phase==="workout"){
        const item=workout[state.index];
        phaseElement.textContent=item.type;
        exerciseElement.textContent=item.name;
        timerElement.textContent=formatTime(state.remaining);
        descriptionElement.textContent=item.description;

        if(item.side){
            if(state.within<15){
                sideElement.textContent="右脚";
                sideElement.className="side right";
            }else{
                sideElement.textContent="左脚";
                sideElement.className="side left";
            }
        }else{
            sideElement.textContent="";
        }

        nextElement.textContent=state.index<workout.length-1?workout[state.index+1].name:cooldown[0].name;
        return;
    }

    if(state.phase==="cooldown"){
        const item=cooldown[state.index];
        phaseElement.textContent="クールダウン";
        exerciseElement.textContent=item.name;
        sideElement.textContent="";
        timerElement.textContent=formatTime(state.remaining);
        descriptionElement.textContent=item.description;
        nextElement.textContent=state.index<cooldown.length-1?cooldown[state.index+1].name:"おつかれさま！";
        return;
    }

    phaseElement.textContent="おつかれさま！";
    exerciseElement.textContent="30分完了！";
    sideElement.textContent="";
    timerElement.textContent="DONE";
    descriptionElement.textContent="今日はここまで水分補給してゆっくり休みましょう。";
    nextElement.textContent="また次回！";
}
function startTimer(){
    if(running)return;
    if(elapsed>=TOTAL_TIME){
        elapsed=0;
        updateDisplay();
    }
    running=true;
    startGif();
    showSpeech(getSpeechForState(getCurrentState()));
    beep(600,0.15);

    timer=setInterval(()=>{
        const before=getCurrentState();
        elapsed++;

        if(elapsed>=TOTAL_TIME){
            elapsed=TOTAL_TIME;
            finishWorkout();
            return;
        }

        const state=getCurrentState();

        if(state.remaining<=5&&state.remaining>0){
            beep(800,0.08);
        }

        if(state.phase!==before.phase||state.index!==before.index){
            beep(1000,0.18);
            showSpeech(getSpeechForState(state));
        }

        updateDisplay();
    },1000);
}

function pauseTimer(){
    running=false;
    clearInterval(timer);
    timer=null;
    pauseGif();
}

seekBar.addEventListener("input",function(){
    elapsed=Number(this.value);
    const state=getCurrentState();
    if(running) showSpeech(getSpeechForState(state));
    updateDisplay();
});

function resetTimer(){
    clearInterval(timer);
    running=false;
    elapsed=0;
    pauseGif();
    gifFrameIndex=0;
    drawGifFrame(0);
    hideSpeech();
    updateDisplay();
}

function finishWorkout(){
    clearInterval(timer);
    running=false;
    pauseGif();
    elapsed=TOTAL_TIME;
    showSpeech("またあした");
    updateDisplay();
    beep(700,0.2);
    setTimeout(()=>beep(900,0.2),250);
    setTimeout(()=>beep(1100,0.4),500);
}

updateDisplay();
</script>
